name: Manifest SBOM

on:
  push:
    branches: [master]
  workflow_dispatch:

# Never run two uploads for the same repository at the same time
concurrency:
  group: manifest-sbom-${{ github.repository }}
  cancel-in-progress: false

env:
  # Set to "true" if this repository contains C or C++ code
  CPP_REPO: "true"
  # Snapshot label: unique to this repository. Never rename or reuse it.
  SNAPSHOT_LABEL: test-snapshot-${{ github.event.repository.name }}

jobs:
  sbom:
    # GitHub-hosted: ubuntu-latest. Self-hosted: your runner labels, e.g. [self-hosted, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Remove this step if the tools are preinstalled on your self-hosted runner
      - name: Install Manifest CLI and generators
        run: |
          BIN="$RUNNER_TEMP/manifest-bin"
          mkdir -p "$BIN"
          curl -sSfL https://raw.githubusercontent.com/manifest-cyber/cli/main/install.sh | sh -s -- -b "$BIN"
          echo "$BIN" >> "$GITHUB_PATH"
          "$BIN/manifest-cli" install --generator syft --destination "$BIN"
          if [ "$CPP_REPO" = "true" ]; then
            "$BIN/manifest-cli" install --generator csbom --destination "$BIN" --version v1.5.1
          fi

      - name: Generate SBOM
        run: |
          OUT="$RUNNER_TEMP"
          if [ "$CPP_REPO" != "true" ]; then
            manifest-cli generate . --generator syft --output cyclonedx-json -f "$OUT/sbom"
            exit 0
          fi

          # 1. Syft: non-C/C++ dependencies (Conan files are left to csbom to avoid duplicates)
          manifest-cli generate . --generator syft --output cyclonedx-json -f "$OUT/sbom-syft" \
            --exclude '**/conan.lock' --exclude '**/conanfile.txt'

          # 2. Conan: csbom needs a conan.lock to capture exact versions, including transitive
          #    dependencies. Create one next to any conanfile that doesn't already have one.
          NEED_LOCK=$(find . \( -name conanfile.py -o -name conanfile.txt \) -not -path '*/test_package/*' \
            -exec sh -c '[ -f "$(dirname "$1")/conan.lock" ] || dirname "$1"' _ {} \; | sort -u)
          if [ -n "$NEED_LOCK" ]; then
            command -v conan >/dev/null || { pipx install conan && conan profile detect --force; }
            for d in $NEED_LOCK; do
              if ! conan lock create "$d"; then
                echo "::warning title=Incomplete C/C++ SBOM::Could not create conan.lock in $d. Conan dependencies there may be missing from the SBOM. Commit a conan.lock or check Conan access."
              fi
            done
          fi

          # 3. csbom: Manifest's C/C++ generator
          manifest-cli generate . --generator csbom --output cyclonedx-json -f "$OUT/sbom-csbom"

          # 4. Merge both into one CycloneDX 1.6 SBOM
          manifest-cli merge "$OUT/sbom-syft.json" "$OUT/sbom-csbom.json" -o cyclonedx-1.6 -f "$OUT/sbom.json"

      # Test only: keep the SBOMs so we can inspect them
      - name: Upload SBOMs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sboms
          path: ${{ runner.temp }}/sbom*.json

      - name: Publish to Manifest (snapshot mode)
        env:
          MANIFEST_API_KEY: ${{ secrets.MANIFEST_API_KEY }}
        run: |
          SNAPSHOT_TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          manifest-cli publish "$RUNNER_TEMP/sbom.json" \
            --api-key "$MANIFEST_API_KEY" \
            --name "${{ github.repository }}" \
            --version "${{ github.sha }}" \
            --snapshot-label "$SNAPSHOT_LABEL" \
            --snapshot-timestamp "$SNAPSHOT_TS"
